name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies (clean install)
        run: npm ci
      - name: Force-install rolldown Linux binding pinned to lockfile (npm/cli#4828 workaround)
        run: |
          ROLLDOWN_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].version")
          echo "Pinning @rolldown/binding-linux-x64-gnu to rolldown ${ROLLDOWN_VERSION}"
          npm install --no-save --force "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"
      - run: npm run test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies (clean install)
        run: npm ci
      - name: Force-install rolldown Linux binding pinned to lockfile (npm/cli#4828 workaround)
        run: |
          ROLLDOWN_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].version")
          echo "Pinning @rolldown/binding-linux-x64-gnu to rolldown ${ROLLDOWN_VERSION}"
          npm install --no-save --force "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"
      - run: npm run test:smoke

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
